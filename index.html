<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css font Family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+CA+Guides&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Playwrite+CA+Guides&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 
    CSS fonts and Text formatting
    Serif
    sans-serif
    monospace
    handwriting/cursive
    Fantasy/decorative
    -->

    <h1 style="font-family: 'Times New Roman', Times, serif;">Welcome to the class</h1>
    <h1 style="font-family: 'Arial', 'Helvetica', sans-serif;">Stop yawning, its too early.</h1>
    <h1 style="font-family: 'Courier New', Courier, monospace;">This is a heading with a monospace font.</h1>
    <h1 style="font-family: 'Georgia', 'Times New Roman', cursive; color: rgb(07,  89, 89 , 0.5);">This is a heading with a serif font.</h1>
    <h1 style="font-family: 'Playwrite CA Guides', cursive; color: rgba(200, 500, 600, 0.8);">This is a heading with a cursive font.</h1>
</body>
</html>
