<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Font Blog Post</title>
    <style>
        body {
            font-family: 'Arial', 'Times New Roman', 'Serif', 'Ubuntu', 
sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        h1 {
            font-family: 'Courier New', 'Courier', 'Courier New', 
monospace, 'Courier', monospace;
            color: #333333;
            text-align: center;
            margin-bottom: 1rem;
        }

        p {
            font-family: 'Georgia', 'Times New Roman', 'Times', 'Serif', 
'Ubuntu', serif;
            color: #000000;
            margin: 1rem;
            line-height: 1.5;
        }

        .handwriting {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida 
Grande', 'Lucida Sans', 'Arial Unicode MS', 'Arial', ' sans-serif', 
'Handwriting/Cursive', 'Fantasy/Decorative';
            font-size: 1.5rem;
            color: #FF5722;
            text-align: center;
            margin: 1rem;
        }

        .monospace {
            font-family: 'Courier New', 'Courier', 'Courier New', 
monospace, 'Courier', monospace;
            font-size: 1.5rem;
            color: #FF5722;
            text-align: center;
            margin: 1rem;
        }

        .handwriting, .monospace {
            font-family: 'Handwriting/Cursive', 'Fantasy/Decorative';
        }
    </style>
</head>
<body>
    <h1>Five Font Blog Post</h1>
    <p>This is a sample blog post using five different font families: 
'Arial', 'Times New Roman', 'Serif', 'Ubuntu', and 'Courier New'. The 
'Handwriting/Cursive' and 'Fantasy/Decorative' are also included as an 
example of decorative and writing styles respectively.</p>
<h1></h1>
<h1></h1>
<h1></h1>
<h1></h1>
<h1></h1>
</body>
</html>
